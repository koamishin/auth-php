name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [8.2, 8.3, 8.4, 8.5]

        name: P${{ matrix.php }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, openssl
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress
            - name: Load SDK integration classes
              run: |
                  php -r 'require "vendor/autoload.php"; foreach ([\Koamishin\Auth\KoamishinServiceProvider::class, \Koamishin\Auth\Console\SetupCommand::class, \Koamishin\Auth\KoamishinRequestGuard::class, \Koamishin\Auth\Middleware\AuthenticateKoamishin::class, \Koamishin\Auth\Middleware\EnsureSetupIntegrity::class] as $class) { if (! class_exists($class)) { fwrite(STDERR, "Unable to load $class\n"); exit(1); } }'

    laravel-integration:
        name: Portal integration (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [8.4, 8.5]

        steps:
            - name: Checkout SDK
              uses: actions/checkout@v4

            - name: Checkout Portal test harness
              uses: actions/checkout@v4
              with:
                  repository: koamishin/koamishin-portal
                  path: portal

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, openssl, sqlite3, pdo_sqlite
                  coverage: none

            - name: Install Portal dependencies
              run: |
                  cp portal/.env.example portal/.env
                  composer install --working-dir=portal --prefer-dist --no-interaction --no-progress

            - name: Test this SDK using the Portal harness
              run: |
                  mkdir -p portal/packages/koamishin-auth-php
                  cp -a src config tests portal/packages/koamishin-auth-php/
                  cd portal
                  php artisan test --compact packages/koamishin-auth-php/tests

    composer-consumer:
        name: Laravel ${{ matrix.laravel }} consumer (PHP ${{ matrix.php }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - laravel: '10'
                      php: '8.2'
                      os: ubuntu-latest
                    - laravel: '11'
                      php: '8.2'
                      os: ubuntu-latest
                    - laravel: '12'
                      php: '8.2'
                      os: ubuntu-latest
                    - laravel: '13'
                      php: '8.3'
                      os: ubuntu-latest
                    - laravel: '13'
                      php: '8.3'
                      os: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, fileinfo, libxml, mbstring, zip, openssl, sqlite3, pdo_sqlite
                  coverage: none
            - name: Install a Laravel consumer and the SDK
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "$RUNNER_OS" = Windows ]; then
                      SDK_ROOT="$(cd "$GITHUB_WORKSPACE" && pwd -W)"
                  else
                      SDK_ROOT="$GITHUB_WORKSPACE"
                  fi
                  composer create-project laravel/laravel "$RUNNER_TEMP/consumer" "^${{ matrix.laravel }}.0" --no-install --no-scripts --no-interaction
                  cd "$RUNNER_TEMP/consumer"
                  cp .env.example .env
                  sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
                  composer config audit.block-insecure false
                  composer config repositories.koamishin path "$SDK_ROOT"
                  composer require 'koamishin/auth-php:@dev' --no-update --no-interaction
                  composer install --prefer-dist --no-interaction --no-progress
                  php artisan key:generate --no-interaction
                  printf '\n%s\n' "Route::fallback(fn () => response('not found', 404));" >> routes/web.php
                  php artisan koamishin:setup --no-interaction
                  cat >> routes/web.php <<'PHP'
                  Route::get('/login', fn () => 'local login');
                  Route::middleware('koamishin.auth')->get('/sdk-private', fn (\Illuminate\Http\Request $request) => $request->user()->getAuthIdentifier());
                  Route::middleware('auth:web')->get('/sdk-local-private', fn () => 'local');
                  PHP
                  cat >> .env <<'ENV'
                  KOAMISHIN_PORTAL_URL=https://portal.test
                  KOAMISHIN_CLIENT_ID=client-id
                  KOAMISHIN_APPLICATION_ID=100
                  KOAMISHIN_ENVIRONMENT=production
                  KOAMISHIN_REDIRECT_URI=https://client.test/koamishin/callback
                  ENV
                  cp "$SDK_ROOT/tests/Integration/InstalledApplicationTest.php" tests/Feature/InstalledApplicationTest.php
                  cp "$SDK_ROOT/tests/Integration/LegacyInterceptionTest.php" tests/Feature/LegacyInterceptionTest.php
                  php artisan route:cache --no-interaction
                  php artisan config:cache --no-interaction
                  KOAMISHIN_LEGACY_CONSUMER_TEST=1 php artisan test --compact tests/Feature/LegacyInterceptionTest.php
                  php artisan config:clear --no-interaction
                  php artisan route:clear --no-interaction
                  rm config/koamishin-setup.php
                  cp "$SDK_ROOT/tests/Fixtures/laravel-react-starter-auth.php" routes/auth.php
                  mkdir -p app/Http/Controllers/Auth
                  cp "$SDK_ROOT/tests/Fixtures/laravel-react-starter-auth-controllers/"*.php app/Http/Controllers/Auth/
                  printf '\n%s\n' "require __DIR__.'/auth.php';" >> routes/web.php
                  php artisan koamishin:setup --migrate-hosted-routes --replace-starter-auth-routes --no-interaction
                  php artisan koamishin:setup --no-interaction
                  cp "$SDK_ROOT/tests/Integration/StarterAuthReplacementTest.php" tests/Feature/StarterAuthReplacementTest.php
                  php artisan route:cache --no-interaction
                  php artisan config:cache --no-interaction
                  KOAMISHIN_STARTER_REPLACEMENT_TEST=1 php artisan test --compact tests/Feature/StarterAuthReplacementTest.php
                  KOAMISHIN_CONSUMER_TEST=1 php artisan test --compact tests/Feature/InstalledApplicationTest.php
