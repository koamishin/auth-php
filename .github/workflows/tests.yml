name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [8.2, 8.3, 8.4, 8.5]

        name: P${{ matrix.php }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, openssl
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

    laravel-integration:
        name: Portal integration (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [8.4, 8.5]

        steps:
            - name: Checkout SDK
              uses: actions/checkout@v4

            - name: Checkout Portal test harness
              uses: actions/checkout@v4
              with:
                  repository: koamishin/koamishin-portal
                  path: portal

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, openssl, sqlite3, pdo_sqlite
                  coverage: none

            - name: Install Portal dependencies
              run: |
                  cp portal/.env.example portal/.env
                  composer install --working-dir=portal --prefer-dist --no-interaction --no-progress

            - name: Test this SDK using the Portal harness
              run: |
                  mkdir -p portal/packages/koamishin-auth-php
                  cp -a src config tests portal/packages/koamishin-auth-php/
                  cd portal
                  php artisan test --compact packages/koamishin-auth-php/tests
